name: Release

# A pushed vX.Y.Z tag is the release. This moves the floating major tag (vX)
# onto it, so authors pinning `@v1` track the latest compatible version, and
# cuts a GitHub Release. Triggering only on three-part tags means the major
# tag this job force-moves never re-triggers the workflow.
on:
   push:
      tags:
         - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
   group: release
   cancel-in-progress: false

jobs:
   release:
      name: Release ${{ github.ref_name }}
      runs-on: ubuntu-latest
      permissions:
         contents: write
      steps:
         -  name: Checkout the tagged commit
            uses: actions/checkout@v4

         -  name: Move the major tag onto this release
            env:
               TAG: ${{ github.ref_name }}
            run: |
               set -euo pipefail
               major="${TAG%%.*}"
               git config user.name "github-actions[bot]"
               git config user.email "github-actions[bot]@users.noreply.github.com"
               git tag -f "$major"
               git push -f origin "refs/tags/$major"
               echo "moved $major -> $TAG"

         -  name: Create the GitHub Release
            env:
               TAG: ${{ github.ref_name }}
               GH_TOKEN: ${{ github.token }}
            run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
